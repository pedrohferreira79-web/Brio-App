<ion-content [fullscreen]="true">

  <div class="materias-container">

    <!-- CABEÇALHO -->
    <div class="cabecalho-materias">

      <h1>Matérias</h1>

      <p>
        Escolha uma matéria para começar seus estudos
      </p>

    </div>


    <!-- MATÉRIAS -->
    <div class="lista-materias">

      <!-- MATEMÁTICA -->
      <div class="card-materia" routerLink="/matematica">
        <div class="icone-materia">
          📐
        </div>

        <strong>Matemática</strong>
      </div>


      <!-- PORTUGUÊS -->
      <div class="card-materia" routerLink="/portugues">
        <div class="icone-materia">
          📚
        </div>

        <strong>Língua Portuguesa</strong>
      </div>


      <!-- BIOLOGIA -->
      <div class="card-materia" routerLink="/biologia">
        <div class="icone-materia">
          🧬
        </div>

        <strong>Biologia</strong>
      </div>


      <!-- GEOGRAFIA -->
      <div class="card-materia" routerLink="/geografia">
        <div class="icone-materia">
          🌎
        </div>

        <strong>Geografia</strong>
      </div>


      <!-- FÍSICA -->
      <div class="card-materia" routerLink="/fisica">
        <div class="icone-materia">
          ⚡
        </div>

        <strong>Física</strong>
      </div>


      <!-- QUÍMICA -->
      <div class="card-materia" routerLink="/quimica">
        <div class="icone-materia">
          🧪
        </div>

        <strong>Química</strong>
      </div>


      <!-- INGLÊS -->
      <div class="card-materia" routerLink="/ingles">
        <div class="icone-materia">
          🔤
        </div>

        <strong>Inglês</strong>
      </div>


      <!-- FILOSOFIA -->
      <div class="card-materia" routerLink="/filosofia">
        <div class="icone-materia">
          ☁️
        </div>

        <strong>Filosofia</strong>
      </div>


      <!-- HISTÓRIA -->
      <div class="card-materia" routerLink="/historia">
        <div class="icone-materia">
          🏛️
        </div>

        <strong>História</strong>
      </div>


      <!-- ARTES -->
      <div class="card-materia" routerLink="/artes">
        <div class="icone-materia">
          🎨
        </div>

        <strong>Artes</strong>
      </div>

    </div>


    <!-- INTRODUÇÃO COM PERSONAGEM -->
    <div class="introducao-materias">

      <div class="personagem-materias">

        <img
          src="assets/personagem-materias.png"
          alt="Personagem BRIO"
        >

      </div>


      <div class="mensagem-materias">

        <span>✨ VAMOS COMEÇAR?</span>

        <h2>
          Escolha seu próximo desafio!
        </h2>

        <p>
          Selecione uma matéria e continue sua jornada
          de aprendizado no BRIO.
        </p>

      </div>

    </div>

  </div>

</ion-content>
