
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Voltar"></ion-back-button>
    </ion-buttons>

    <ion-title>Redefinir senha</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="login-container">

    <div class="titulo">
      <h1>Nova senha</h1>
      <p>Digite e confirme sua nova senha para acessar sua conta BRIO.</p>
    </div>

    <div class="formulario">

      <ion-label>Nova senha</ion-label>

      <ion-item class="campo">
        <ion-input
          [(ngModel)]="novaSenha"
          [type]="mostrarSenha ? 'text' : 'password'"
          placeholder="Digite sua nova senha">
        </ion-input>

        <ion-icon
          slot="end"
          [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'"
          (click)="mostrarSenha = !mostrarSenha">
        </ion-icon>
      </ion-item>

      <ion-label class="label-campo">
        Confirmar nova senha
      </ion-label>

      <ion-item class="campo">
        <ion-input
          [(ngModel)]="confirmarSenha"
          type="password"
          placeholder="Confirme sua nova senha">
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        type="button"
        class="ion-margin-top"
        (click)="redefinirSenha()">
        Salvar nova senha
      </ion-button>

    </div>

  </div>

</ion-content>
