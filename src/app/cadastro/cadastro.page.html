<ion-header>
  <ion-toolbar>
    <ion-title>Cadastro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="cadastroForm" (ngSubmit)="cadastrar()">
    <ion-item>
      <ion-label position="floating">E-mail</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="cadastroForm.get('email')?.touched && cadastroForm.get('email')?.invalid">
      <p>Informe um e-mail válido.</p>
    </ion-text>

    <ion-item>
      <ion-label position="floating">Senha</ion-label>
      <ion-input type="password" formControlName="senha"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="cadastroForm.get('senha')?.touched && cadastroForm.get('senha')?.invalid">
      <p>A senha deve ter pelo menos 6 caracteres.</p>
    </ion-text>

    <ion-item>
      <ion-label position="floating">Confirmar senha</ion-label>
      <ion-input type="password" formControlName="confirmarSenha"></ion-input>
    </ion-item>
    <ion-text
      color="danger"
      *ngIf="cadastroForm.get('confirmarSenha')?.touched && cadastroForm.errors?.['senhasDiferentes']"
    >
      <p>As senhas não coincidem.</p>
    </ion-text>

    <ion-button expand="block" type="submit" class="ion-margin-top">
      Cadastrar
    </ion-button>
  </form>

  <ion-button expand="block" fill="clear" routerLink="/home">
    Já tenho conta
  </ion-button>
</ion-content>
